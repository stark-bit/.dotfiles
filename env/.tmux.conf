# ============================================
# General
# ============================================
set-option -g default-shell /bin/zsh
set -g base-index 1

# ============================================
# Terminal fixes
# ============================================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'                                                        # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours (needs tmux-3.0)

# ============================================
# Prefix
# ============================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ============================================
# Copy mode (vi)
# ============================================
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
if-shell 'uname | grep -qi Darwin' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"'

# ============================================
# Navigation - Windows
# ============================================
bind -r n next-window
bind -r p previous-window
# bind -r a last-window  # replaced by scratch popup toggle
bind -r ^ last-window

# ============================================
# Navigation - Sessions
# ============================================
bind -r N switch-client -n
bind -r P switch-client -p
bind-key A switch-client -l
bind-key j choose-tree -swZy -O name

# ============================================
# Panes
# ============================================
bind -r x kill-pane
bind-key S swap-pane -D
bind-key s run-shell 'echo "#{session_name}:#{window_index}.#{pane_index}" > /tmp/tmux_marked_pane' \; display-message "Pane marked"
bind-key m run-shell 'if [ -f /tmp/tmux_marked_pane ]; then tmux join-pane -h -s "$(cat /tmp/tmux_marked_pane)"; rm /tmp/tmux_marked_pane; else tmux display-message "No pane marked"; fi'

# ============================================
# Utilities
# ============================================
bind r source-file ~/.tmux.conf
bind-key R source-file $DEV_ENV/env/.tmux.conf \; display-message "Sourced from $DEV_ENV"
bind-key + command-prompt -I "#S" "rename-session '%%'"
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# ============================================
# Popups
# ============================================
bind g display-popup -E -d "#{pane_current_path}" -xC -yC -w 95% -h 95% "lazygit"

# Toggle global modal popup (prefix + a)
# If in global-modal session -> detach (closes popup)
# Otherwise -> open popup with global-modal session
bind-key a if-shell '[ "#{session_name}" = "global-modal" ]' \
  'detach-client' \
  'display-popup -E -d "#{pane_current_path}" -xC -yC -w 95% -h 95% "tmux new-session -A -s global-modal"'

# Same toggle without prefix (C-/ sends C-_ in most terminals)
# Opens a repo-specific modal session based on git repo name
bind-key -n C-_ if-shell 'echo "#{session_name}" | grep -q -- "-modal$"' \
  'detach-client' \
  'display-popup -E -d "#{pane_current_path}" -xC -yC -w 95% -h 95% "tmux new-session -A -s $(basename $(git rev-parse --show-toplevel 2>/dev/null || echo repo))-modal"'

# ============================================
# Theme
# ============================================
set -g status-style 'bg=#333333 fg=#5eacd3'
set -g status-left-length 50

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=black,bg=yellow"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#7aa2f7,bg=#1f2335"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#1d202f,bg=#e0af68,bold] #S #[fg=#e0af68,bg=#1f2335,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#1f2335] #{prefix_highlight} #[fg=#3b4261,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %I:%M %p #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#1d202f,bg=#7aa2f7,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#1f2335] #{prefix_highlight} #[fg=#3b4261,bg=#1f2335,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261] %Y-%m-%d  %H:%M #[fg=#7aa2f7,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#1d202f,bg=#7aa2f7,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#1f2335"
setw -g window-status-format "#[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#1f2335,bg=#1f2335,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#1f2335,bg=#7aa2f7,nobold,nounderscore,noitalics]#[fg=#3b4261,bg=#7aa2f7,bold] #I  #W #F #[fg=#7aa2f7,bg=#1f2335,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#e0af68]#[bg=#1f2335]#[fg=#1f2335]#[bg=#e0af68]"
set -g @prefix_highlight_output_suffix ""

